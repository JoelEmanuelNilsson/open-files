# Intel One Mono. Joel tunes every number here by eye, at the size he actually
# reads at; there is no formula behind them.
# The primary font: the first font-family Ghostty sees wins.
font-family = Intel One Mono
# Hack Nerd Font Mono second, as fallback so icon glyphs keep rendering.
# It lives here rather than in ghostty/config because Ghostty loads an included
# file after the file that includes it: a fallback in ghostty/config would be
# parsed first and become the primary font.
font-family = Hack Nerd Font Mono
# Point size of that font.
font-size = 16
# Extra leading: line spacing measures better for dyslexic reading than any
# font choice does.
adjust-cell-height = 30%
# Letter spacing. Wider tracking is the best-evidenced single change for
# dyslexic reading (Zorzi 2012: spacing alone, no training, improved reading
# in dyslexic children). A mono grid can only get it by widening the cell.
adjust-cell-width = 3%
