# ---------------------------------------------------------------------------
# THE light mode. Not a theme: the [light] table every setup in setups/ gets,
# merged in by gen.load_setup_toml. A setup that wants to differ writes its own
# [light] keys and they override these one by one.
#
# It lives here because it was three identical copies -- one per setup -- which
# is not a shared light mode, it is three that happen to agree today.
#
# after cardboard, by Erik Hilbert:
# https://github.com/ErikHilbert1/cardboard-theme -- "A desaturated, light
# theme." Warm sand paper, cool slate ink.
#
# AFTER, not a port, and the difference is the whole story of this file.
# cardboard is a desktop terminal's idle colourscheme; this is the palette
# every program in this terminal reads code through, and the reference is not
# legible enough to do that job. Measured on its own background, its twelve
# accent slots run 1.94:1 to 3.77:1, and on slot 0 -- where a TUI paints most
# of its text -- 1.56:1 to 3.03:1. An earlier version of this file shipped
# those bytes exactly and declared floors down to 2.69 to get them past
# generation. That is how a theme ends up unreadable with every test passing.
#
# WHAT IS STILL THE REFERENCE
#   bg #e5dfd3, exactly. The most-seen colour in the theme, and a background
#   has nothing to be legible against.
#   Both hues: paper at h 84.6 and ink at h 196.7, which is what cardboard
#   looks like from across the room.
#   The desaturation. Accent chroma is 0.095 against a normal theme's 0.11.
#
# WHAT IS NOT
#   The ink lightnesses. fg was #4a5353 and is darker, because 7:1 on a panel
#   is what this repo's default floor asks for and #4a5353 holds 4.80.
#   The accent hues. cardboard's six are one pair of sRGB bytes permuted across
#   three channels -- red is (hi,lo,lo), cyan is (lo,hi,hi) -- which puts its
#   green and its yellow 37 degrees apart. Two colours that close separate only
#   by being saturated, and at 4.5:1 that needs chroma 0.15: vivid, which is
#   the one thing this theme is not. So the hues are gen.py's own spread, no
#   two closer than 45 degrees, and the quiet is kept in the chroma instead.
#   The brights. cardboard's are LIGHTER than its bases (0xa3 over 0x89), so on
#   paper its emphasis colour is the one you can see least. Here they go toward
#   the ink.
#
# There is no [floors] block. This mode meets gen.py's defaults -- fg 7,
# muted 5, dim 3, accent 4.5, accent_distance 0.08 -- on bg AND on slot 0.
# ---------------------------------------------------------------------------

# "View of Vent in the Ventertal", a 19th-century Alpine oil: a barn interior
# looking out on the valley. From gruvbox-wallpapers' painting/ set, downscaled
# from 5005x3419 to the display's own width, which is where every other
# wallpaper in this directory tops out.
#
# It is here rather than cardboard's own block-printed floral because of the
# rule in README's glass section: glass pulls the wallpaper's averaged colour
# through, so it only reads as glass when the wallpaper is the theme's colour
# family. This painting averages #7c6953 -- h 70.9, warm brown, 14 degrees off
# the paper's h 84.6. cardboard.jpg averaged #9da5a4: h 188, cool grey, 103
# degrees away and the exact case the README names as grey milk.
wallpaper = "ventertal.jpg"

# Light mode is opaque, and this file is the [light] table, so these two keys
# are the light mode's -- they override the setup's top-level opacity/blur,
# which stays the default and keeps the dark half its glass. bin/theme writes
# whichever mode is current and Ghostty picks it up on SIGUSR2 (1.3.1; see
# write_glass -- the docs' "requires restarting Ghostty" is wrong for this
# include).
#
# Opaque because paper behind glass is what made this mode unreadable: 0.68
# over this file's own wallpaper turns bg #e5dfd3 into about #ab9f95 and takes
# roughly a third off every contrast ratio the palette was solved for. Dark ink
# on a dark painting is the one composite nothing recovers. blur = 0 for the
# same reason -- Ghostty only blurs what shows through, and nothing does.
opacity = 1.0
blur = 0

# Two hues, because this palette has two. Paper is warm sand (h 85) and ink is
# cool slate (h 197): 112 degrees apart, which one seed cannot hold. `text_seed`
# exists for exactly this; see gen.build_palette.
seed = "#e5dfd3"       # paper.  L 0.905  C 0.0174  h 84.6
text_seed = "#4a5353"  # ink.    the reference's foreground, used here for its
                       # HUE. Its lightness is no longer the fg -- see below.

# The chroma of each family, taken off the reference's own background and
# foreground. Note the surfaces are the warmer of the two despite looking grey.
tint = 0.0174
text_tint = 0.0115  # the reference's own ink chroma, exactly.

# The surface tiers, by OKLCH lightness. bg is exact. The other two are the
# reference's lightnesses at the reference's background chroma, which is as
# close as one `tint` reaches: cardboard's greys DESATURATE as they darken
# (C 0.017 -> 0.011 -> 0.005) and a single chroma cannot follow that curve.
#
#   surface    want #cccac2  got #cfc9bd  OKLab 0.007 apart
#   selection  want #b3b5b2  got #bab4a8  OKLab 0.016 apart
#
# One perceptual step is about 0.02, so both are inside it and the larger of
# the two errors is on selection, which is transient, rather than on slot 0,
# which is every panel on screen. Making bg inexact to spread the error would
# trade the most-seen colour in the theme for the least-seen one.
bg = 0.905
surface = 0.838
selection = 0.771

# The ink tiers, each at the lightness that just clears its floor on SLOT 0 --
# the panel, which is darker than the paper and is where a TUI paints most of
# its text. Solve there and the ratio on bg comes for free.
#
#          hex        on bg   on slot 0
#   dim    #637171    3.83:1    3.08:1
#   muted  #464f4f    6.35:1    5.11:1
#   fg     #313a3a    8.81:1    7.09:1
#
# Slot 0 and not the composited background, even while this mode was glass: a
# cell with an explicit background is drawn fully opaque, because Ghostty
# applies `background-opacity` to the default background only
# (`background-opacity-cells` is false by default). Text on a panel was never
# the text in trouble; text on the default background was, which is why this
# mode is opaque now rather than darker -- see the opacity block above.
#
# fg is darker than cardboard's own #4a5353, which holds 4.80 on slot 0 against
# this repo's 7:1 floor. The reference contributes the hue, not the lightness.
dim = 0.538
muted = 0.421
fg = 0.339
strong = 0.290  # one step past the ink, so emphasis can still show

# A block cursor filled with ink, reversed out to paper -- which is what foot
# does by default, and cardboard sets no cursor colour precisely because the
# default is already right. cursor_tint drops the usual 0.12 to the ink's own
# chroma; at hue 197 the default would put a saturated teal block on the page.
cursor = 0.339
cursor_tint = 0.0115

# The six accents, derived rather than listed. See the header for why the
# reference's own hues could not be kept: its green and yellow are 37 degrees
# apart and only separate when they are loud.
hue_pull = 0          # gen.py's full spread, no two hues closer than 45 degrees
accent_chroma = 0.095 # a normal theme here is 0.11. This is where the quiet
                      # lives now that it cannot live in the lightness: the six
                      # read as earth tones, not as terminal primaries.
                      # Below ~0.095 the closest pair falls under the 0.08
                      # distance floor at this lightness.
accent = 0.441        # the lightness at which the worst of the six clears
                      # 4.5:1 on slot 0, the floor this mode declares no
                      # exception to. All six share it, so nothing in a diff is
                      # emphasised by accident.
bright_delta = -0.06  # toward the ink, not away from it. A bright slot is
                      # emphasis, and on paper emphasis is darker. cardboard's
                      # brights go the other way (0xa3 over 0x89), which puts
                      # its emphasis colour where you can see it least.
